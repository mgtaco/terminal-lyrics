# Tag `vX.Y.Z` and push it; this builds a binary for every supported target and
# attaches them to a GitHub Release.
#
# The point is that installing should not require a Rust toolchain. `cargo
# install terminal-lyrics` covers people who have one; this covers everyone else,
# and it is what the AUR `-bin` package downloads.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Statically linked, so one Linux download runs on any distro
          # regardless of how old its glibc is.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `rustls` pulls `aws-lc-rs`, which compiles BoringSSL from source, so a
      # musl build needs a musl-targeting C compiler and cmake — neither is on
      # the runner by default, and without them the C build fails long before
      # any Rust does.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      # `[profile.release]` already sets `strip = true`, so the binary that comes
      # out of the build is the one to ship.
      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="lyrics-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/${{ matrix.target }}/release/lyrics "dist/${name}/"
          cp README.md LICENSE config.example.toml "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          shasum -a 256 "dist/${name}.tar.gz" | awk '{print $1}' > "dist/${name}.tar.gz.sha256"
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what is being published
        run: ls -lh dist

      # Create-or-update, so re-running a tag refreshes its assets rather than
      # failing on a release that already exists.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
