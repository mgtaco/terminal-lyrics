# Tag `vX.Y.Z` and push it; this builds a binary for every supported target and
# attaches them to a GitHub Release.
#
# The point is that installing should not require a Rust toolchain. `cargo
# install terminal-lyrics` covers people who have one; this covers everyone else,
# and it is what the AUR `-bin` package downloads.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Statically linked, so one Linux download runs on any distro
          # regardless of how old its glibc is.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `rustls` pulls `aws-lc-rs`, which compiles BoringSSL from source, so a
      # musl build needs a musl-targeting C compiler and cmake — neither is on
      # the runner by default, and without them the C build fails long before
      # any Rust does.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      # `[profile.release]` already sets `strip = true`, so the binary that comes
      # out of the build is the one to ship.
      #
      # Everything is a .tar.gz, Windows included. A .zip would be the more
      # familiar download there, but `tar` has shipped in Windows since 10 and
      # one archive format means one code path — worth more than the convention.
      #
      # No checksum file is published alongside these. GitHub computes a SHA-256
      # for every asset on upload and shows it in the release page and the API
      # (`.assets[].digest`), so a sidecar would only repeat it — and repeat it
      # less trustworthily, being written by the same job that built the archive
      # rather than by the server receiving it.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="lyrics-${version}-${{ matrix.target }}"
          bin="lyrics${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}"

          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cp README.md LICENSE config.example.toml "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what is being published
        run: ls -lh dist

      # Create-or-update, so re-running a tag refreshes its assets rather than
      # failing on a release that already exists.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

  crates-io:
    name: Publish to crates.io
    # Last, and deliberately so. A GitHub release can be deleted and rebuilt; a
    # crates.io version cannot. It can be yanked, but the number is spent for
    # good. So this only runs once every target has built and the release is up.
    needs: [build, release]
    runs-on: ubuntu-latest
    # Trusted publishing: GitHub mints a short-lived OIDC token proving this
    # workflow in this repository is what is asking, and crates.io swaps it for
    # a registry token that expires in half an hour. There is no API token in
    # the repository secrets to leak, rotate, or forget about. `contents: read`
    # narrows the top-level `write`, which exists for the release job above and
    # is not needed here.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Both guards below are worth far more than the seconds they cost, for the
      # same reason the job runs last: there is no undo.
      #
      # A tag that disagrees with the manifest is a bumped-and-forgot mistake,
      # and it is silent everywhere else — the packaging step names archives
      # from the tag, so `v0.3.0` would ship archives called 0.3.0 containing a
      # 0.2.0 binary, and this would publish 0.2.0 over again.
      - name: Check the tag against the manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "terminal-lyrics") | .version')
          echo "tag ${tag}, manifest ${manifest}"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v${tag} does not match Cargo.toml ${manifest}"
            exit 1
          fi

      # Re-running a tag is supported above — the release action refreshes its
      # assets. crates.io has no equivalent: publishing a version twice is an
      # error. So check first and skip, letting a re-run finish green instead of
      # failing on the one job that already did its work.
      #
      # A failure to reach the index at all (or a crate with no versions yet)
      # falls through to the publish, which is the right way round: the worst
      # case is a publish that errors, not a release that silently skips.
      - name: Is this version already published?
        id: check
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if curl -sSf https://index.crates.io/te/rm/terminal-lyrics \
            | jq -e --arg v "$version" -s 'any(.[]; .vers == $v)' >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned exactly: this action publishes no moving major tag, so `@v1`
      # would not resolve.
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
        if: steps.check.outputs.already == 'false'

      - name: Publish
        if: steps.check.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Nothing to publish
        if: steps.check.outputs.already == 'true'
        run: echo "::notice::${GITHUB_REF_NAME} is already on crates.io"
