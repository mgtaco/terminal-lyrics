# Push a `vX.Y.Z` tag to build every target's binary and attach them to a GitHub
# Release, which the AUR `-bin` package downloads.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Statically linked, so one Linux download runs on any distro
          # regardless of how old its glibc is.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # aws-lc-sys compiles BoringSSL, so musl needs a musl C compiler and
      # cmake.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake

      # The runner's GCC defaults to x86-64-v3, which put AVX in aws-lc's C and
      # made 0.5.0 die with SIGILL at startup on CPUs without it.
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64
          CFLAGS_x86_64_unknown_linux_musl: -march=x86-64
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check it runs on a baseline x86-64 CPU
        if: contains(matrix.target, '-linux-')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user
          qemu-x86_64 -cpu qemu64 "target/${{ matrix.target }}/release/lyrics" --version

      # .tar.gz everywhere, Windows included (`tar` ships since Windows 10). No
      # checksum file: GitHub records each asset's SHA-256 on upload.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="lyrics-${version}-${{ matrix.target }}"
          bin="lyrics${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}"

          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cp -R README.md LICENSE licenses config.example.toml "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what is being published
        run: ls -lh dist

      # Create-or-update, so re-running a tag refreshes its assets rather than
      # failing on a release that already exists.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

  crates-io:
    name: Publish to crates.io
    # Last: a crates.io version cannot be rebuilt, only yanked, so this waits
    # for every target and the release.
    needs: [build, release]
    runs-on: ubuntu-latest
    # Trusted publishing: an OIDC token is swapped for a short-lived registry
    # token, so there is no API token in the secrets.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # A tag that disagrees with the manifest would ship archives named for the
      # tag holding the old binary, and publish the old version again.
      - name: Check the tag against the manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "terminal-lyrics") | .version')
          echo "tag ${tag}, manifest ${manifest}"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v${tag} does not match Cargo.toml ${manifest}"
            exit 1
          fi

      # Publishing a version twice is an error, so a re-run skips it. Failing to
      # reach the index falls through to the publish, which then errors loudly.
      - name: Is this version already published?
        id: check
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if curl -sSf https://index.crates.io/te/rm/terminal-lyrics \
            | jq -e --arg v "$version" -s 'any(.[]; .vers == $v)' >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned exactly: this action publishes no moving major tag, so `@v1`
      # would not resolve.
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
        if: steps.check.outputs.already == 'false'

      - name: Publish
        if: steps.check.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Nothing to publish
        if: steps.check.outputs.already == 'true'
        run: echo "::notice::${GITHUB_REF_NAME} is already on crates.io"

  # The README's install line against the release just published, so a change to
  # the archive names fails on the tag that made it.
  install-script:
    name: install.sh (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install this release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LYRICS_VERSION: ${{ github.ref_name }}
          LYRICS_INSTALL_DIR: ${{ runner.temp }}/bin
        run: sh install.sh

      - name: Check the version
        run: |
          set -eu
          out=$("${{ runner.temp }}/bin/lyrics" --version)
          echo "$out"
          [ "$out" = "lyrics ${GITHUB_REF_NAME#v}" ]

  # The PKGBUILD pins the archive's SHA-256, which only exists once the release
  # is up, so it is bumped here rather than in the release commit.
  aur-bin:
    name: Point the AUR -bin package at this release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # pkgver cannot hold a hyphen, so a pre-release cannot be packaged.
          case "$version" in
            *-*)
              echo "::notice::${GITHUB_REF_NAME} is a pre-release; the PKGBUILD stays where it is"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          archive="lyrics-${version}-x86_64-unknown-linux-gnu.tar.gz"
          digest=$(gh release view "$GITHUB_REF_NAME" --json assets \
            --jq ".assets[] | select(.name == \"${archive}\") | .digest")
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::${GITHUB_REF_NAME} has no SHA-256 for ${archive}"; exit 1 ;;
          esac

          {
            echo "skip=false"
            echo "version=${version}"
            echo "sha256=${digest#sha256:}"
          } >> "$GITHUB_OUTPUT"

      - name: Update the PKGBUILD
        if: steps.release.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          f=packaging/aur-bin/PKGBUILD
          sed -i \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${SHA256}')/" \
            "$f"
          # sed succeeds even when a pattern matched nothing.
          grep -qx "pkgver=${VERSION}" "$f"
          grep -qx "pkgrel=1" "$f"
          grep -qx "sha256sums=('${SHA256}')" "$f"
          bash -n "$f"
          git diff

      - name: Check the source downloads and matches
        if: steps.release.outputs.skip == 'false'
        env:
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          url=$(bash -c 'source packaging/aur-bin/PKGBUILD; echo "${source[0]#*::}"')
          echo "$url"
          curl -fsSL -o archive.tar.gz "$url"
          echo "${SHA256}  archive.tar.gz" | sha256sum -c -
          rm archive.tar.gz

      - name: Commit and push
        if: steps.release.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::notice::the PKGBUILD is already on ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Install ${VERSION} with the Arch -bin package" \
            -m "Points the PKGBUILD at the ${VERSION} release, with GitHub's SHA-256 for its archive."
          # main may have moved since the tag.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::could not push the PKGBUILD bump"
          exit 1
