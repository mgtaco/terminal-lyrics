# Every push and pull request, on every platform that has a player backend.
#
# No system packages are installed, because nothing here needs one: `zbus` is
# pure Rust, so there is no libdbus to find, and `rustls` brings its own TLS
# rather than looking for a system OpenSSL. It does not follow that the build is
# C-free — `rustls` pulls `aws-lc-rs`, whose `aws-lc-sys` compiles BoringSSL from
# source — but every runner already ships a working C compiler, so that builds
# without help. It is cross-compiling that trips over it, which is why the
# Windows job below runs on a Windows runner rather than `--target`ing one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux and macOS each compile their own backend and run the tests gated to
  # them: `tests/macos_probe.rs` is `#![cfg(target_os = "macos")]`, so it has
  # never run anywhere until this job existed.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Windows cannot be folded into the matrix above: the SMTC backend is the one
  # platform whose code nobody here can run by hand, so this job is the only
  # thing standing between `src/player/windows.rs` and silent rot. It runs the
  # tests rather than a bare check, because `tests/windows_probe.rs` is
  # `#![cfg(target_os = "windows")]` and this is the only place it executes.
  windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
