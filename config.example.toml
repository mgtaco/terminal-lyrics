# terminal-lyrics configuration.
# Copy to ~/.config/terminal-lyrics/config.toml — every key is optional, and
# every one of them is also a command-line flag, which takes precedence.

# Which player to follow. Omit to let the program choose, which prefers whatever
# is actually playing. On Linux this is an MPRIS name, e.g. "spotify" or "vlc";
# on macOS it is "spotify" or "music". A prefix is enough.
# player = "spotify"

# "block" (5 rows), "compact" (3 rows) or "mini" (plain text).
# The visualiser steps down automatically when the terminal is too small.
font = "block"

# Shift lyrics in milliseconds; positive shows them later.
offset_ms = 0

# Check this directory for "Artist - Title.lrc" before querying the network.
# lrc_dir = "~/lyrics"

# Set false to use only the cache and lrc_dir — no AMLL, no LRCLIB.
network = true

# Show one word at a time when the lyrics carry real per-word timings.
# Lines without word timings are always shown whole.
word_by_word = true

# When to highlight the sung part of what is on screen.
#   "never"  — no highlight (default)
#   "auto"   — only when the lyrics carry real per-word timestamps
#   "always" — also for line-level lyrics, where the highlight is an estimate
sweep = "never"

# Redraw interval in milliseconds (10–1000). Only the sweep moves between
# player events, and unchanged cells are not redrawn at all.
tick_ms = 30

# How far the predicted position may drift from the player's own reading
# before re-anchoring, in milliseconds (50–5000).
resync_threshold_ms = 250
