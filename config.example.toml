# terminal-lyrics configuration.
# Copy to ~/.config/terminal-lyrics/config.toml — every key is optional, and
# every one of them is also a command-line flag, which takes precedence.

# Which player to follow. Omit to let the program choose, which prefers whatever
# is actually playing. On Linux this is an MPRIS name, e.g. "spotify" or "vlc";
# on macOS it is "spotify" or "music". A prefix is enough.
# player = "spotify"

# "block" (5 rows), "compact" (3 rows) or "mini" (plain text).
# The visualiser steps down automatically when the terminal is too small.
font = "block"

# Where a song starts before you nudge it, in milliseconds; positive shows the
# lyrics later. Nudging with `,` and `.` saves that song's own offset, which is
# used instead the next time it comes on; `0` forgets it and returns the song to
# this value. `lyrics paths` prints the file the per-song offsets live in.
offset_ms = 0

# Check this directory for "Artist - Title.lrc" before querying the network.
# lrc_dir = "~/lyrics"

# Set false to use only the cache and lrc_dir — no network lookups at all.
network = true

# Which lyrics sources to consult. The lookup is DankMaterialShell's, so with
# the default list both pick the same lyrics for a song. Dropping a name turns
# that provider off; an unknown name is an error, not a silent skip.
#
#   betterlyrics  Apple Music's TTML, syllable-timed
#   unison        BetterLyrics' community lyrics, TTML or enhanced LRC
#   lyricsplus    syllable-timed JSON with backing vocals
#   kugou         KuGou's word-timed KRC
#   lrclib        millions of tracks, line-level nearly always
#   youtubemusic  YouTube Music's lyrics, line-level
#
# All of them are asked at once. Better timing wins (word over line), and the
# order here breaks ties between answers that are equally good. A provider
# that is down is stepped over rather than failing the lookup.
#
# The cache is shared with DankMaterialShell when ~/.cache/DankMaterialShell
# exists; `lyrics paths` prints where it is.
providers = ["betterlyrics", "unison", "lyricsplus", "kugou", "lrclib", "youtubemusic"]

# Show one word at a time when the lyrics carry real per-word timings.
# Lines without word timings are always shown whole.
word_by_word = true

# When two voices are singing at once, show both, stacked. A background vocal
# is drawn above the line in grey and a size smaller; the other half of a duet
# is drawn full size, because it is a voice and not an echo. Set false to show
# one line at a time, whichever came in most recently. The `v` key toggles it.
overlapping_voices = true

# Where the accent colour comes from. The default paints nothing itself: the
# display is drawn in your terminal's own palette entries, so it already follows
# whatever colour scheme the terminal is set to. Naming a source here repaints
# the lyric text and nothing else: the sweep highlight and the status lines stay
# terminal palette colours.
#
#   terminal        the terminal's palette, untouched (default)
#   pywal           ~/.cache/wal/colors.json, as written by pywal
#   fixed:#rrggbb   a literal colour
#   file:PATH       any file in pywal's JSON shape
#
# A palette that cannot be read — pywal has never run, the path is wrong — falls
# back to the terminal rather than refusing to start. A misspelt source is an
# error, because that is a typo rather than a missing file.
color_source = "terminal"

# When to highlight the sung part of what is on screen.
#   "never"  — no highlight (default)
#   "auto"   — only when the lyrics carry real per-word timestamps and the whole
#              line is on screen; with word_by_word there is nothing to point at
#   "always" — also for line-level lyrics, where the highlight is an estimate
sweep = "never"

# Redraw interval in milliseconds (10–1000). Only the sweep moves between
# player events, and unchanged cells are not redrawn at all.
tick_ms = 30

# How far the predicted position may drift from the player's own reading
# before re-anchoring, in milliseconds (50–5000).
resync_threshold_ms = 250
