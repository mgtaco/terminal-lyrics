# terminal-lyrics configuration.
# Copy to ~/.config/terminal-lyrics/config.toml — every key is optional, and
# every one of them is also a command-line flag, which takes precedence.

# Which player to follow. Omit to let the program choose, which prefers whatever
# is actually playing. On Linux this is an MPRIS name, e.g. "spotify" or "vlc";
# on macOS it is "spotify" or "music". A prefix is enough.
# player = "spotify"

# "block" (5 rows), "compact" (3 rows) or "mini" (plain text).
# The visualiser steps down automatically when the terminal is too small.
font = "block"

# Where a song starts before you nudge it, in milliseconds; positive shows the
# lyrics later. Nudging with `,` and `.` saves that song's own offset, which is
# used instead the next time it comes on; `0` forgets it and returns the song to
# this value. `lyrics paths` prints the file the per-song offsets live in.
offset_ms = 0

# Check this directory for "Artist - Title.lrc" before querying the network.
# lrc_dir = "~/lyrics"

# Set false to use only the cache and lrc_dir — no network lookups at all.
network = true

# Which lyrics sources to consult, in the order they are consulted. Dropping a
# name turns that provider off; an unknown name is an error, not a silent skip.
#
#   amll        the AMLL TTML database, syllable-timed, keyed by Spotify ID
#   lyricsplus  Apple Music's TTML, syllable-timed, matched by artist/title
#   lrcmux      Musixmatch, KuGou, NetEase, Genius, YouTube Music — word-timed
#   lrclib      millions of tracks, line-level only
#
# The default order puts the best-looking source first and the widest last, so
# a better set of lyrics is never passed over for a merely likelier one. A
# provider that is down is stepped over rather than failing the lookup.
providers = ["amll", "lyricsplus", "lrcmux", "lrclib"]

# The two community-run instances above. Both projects document self-hosting,
# and both are one person's server, so point these at your own if you rely on
# them.
lyricsplus_url = "https://lyricsplus.prjktla.my.id"
lrcmux_url = "https://api.lrcmux.dev"

# Show one word at a time when the lyrics carry real per-word timings.
# Lines without word timings are always shown whole.
word_by_word = true

# When two voices are singing at once, show both, stacked. A background vocal
# is drawn above the line in grey and a size smaller; the other half of a duet
# is drawn full size, because it is a voice and not an echo. Set false to show
# one line at a time, whichever came in most recently. The `v` key toggles it.
overlapping_voices = true

# When to highlight the sung part of what is on screen.
#   "never"  — no highlight (default)
#   "auto"   — only when the lyrics carry real per-word timestamps
#   "always" — also for line-level lyrics, where the highlight is an estimate
sweep = "never"

# Redraw interval in milliseconds (10–1000). Only the sweep moves between
# player events, and unchanged cells are not redrawn at all.
tick_ms = 30

# How far the predicted position may drift from the player's own reading
# before re-anchoring, in milliseconds (50–5000).
resync_threshold_ms = 250
