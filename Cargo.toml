[package]
name = "terminal-lyrics"
version = "0.1.1"
edition = "2024"
description = "Giant block lyrics in your terminal, synced to whatever is playing"
license = "MIT"
repository = "https://github.com/mgtaco/terminal-lyrics"
homepage = "https://github.com/mgtaco/terminal-lyrics"
readme = "README.md"
keywords = ["lyrics", "terminal", "tui", "mpris", "music"]
categories = ["command-line-utilities", "multimedia::audio"]
# Not the edition 2024 floor (1.85) but the highest any dependency asks for:
# `ratatui` 0.30 wants 1.88, so nothing older can build this at all.
rust-version = "1.88"

[lib]
name = "terminal_lyrics"
path = "src/lib.rs"

[[bin]]
name = "lyrics"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-lite = "2.6.1"
quick-xml = "0.42.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2", "query", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
toml = "1.1.4"
unicode-width = "0.2.2"

# Integration tests drive the async provider chain directly; nothing else in
# `tests/` needs a runtime, so this is the smallest one that will do.
[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }

# The player backend is chosen at compile time; see src/player/mod.rs. Gating the
# dependency here is what lets a Linux package build without ever fetching the
# other platforms' code, and what lets this crate build at all off Linux.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

# The macOS backend shells out to osascript; nothing else needs tokio::process.
[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1.53.1", features = ["process"] }

[profile.release]
lto = true
strip = true
